name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests + ArchUnit + Testcontainers integration tests (Docker is available on the runner)
      - name: Build and test
        run: mvn -B verify

      - name: Build container image
        run: docker build -t clinic-hexagonal:${{ github.sha }} .
