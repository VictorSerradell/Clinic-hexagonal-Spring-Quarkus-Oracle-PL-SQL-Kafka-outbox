spring:
  application:
    name: clinic-hexagonal
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema and PL/SQL live in /db/init (versioned SQL, not generated)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: clinic-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

clinic:
  events:
    topic: clinic.appointment.events
  outbox:
    poll-interval-ms: 1000
  coverage:
    mode: stub                                   # stub | rest
    base-url: http://localhost:8089              # only used when mode=rest
  security:
    # Dev only: HS256 shared secret (>= 32 chars). In production remove it and use
    # spring.security.oauth2.resourceserver.jwt.issuer-uri (Keycloak, Entra ID, Auth0...).
    jwt-secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-32b}

management:
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /readiness for Kubernetes
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
